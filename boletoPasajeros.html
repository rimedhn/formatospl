<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boleto de pasajero</title>
  <style>
    * {
      box-sizing: border-box;
    }

    @page {
      size: auto;
      margin: 4mm;
    }

    body {
      margin: 0;
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.15;
    }

    .ticket {
      width: 100%;
      padding: 4mm;
      overflow-wrap: anywhere;
    }

    .logo {
      display: block;
      width: clamp(42px, 12vw, 76px);
      height: auto;
      margin-bottom: 12px;
    }

    .company {
      margin: 0;
      font-size: 1.25em;
      line-height: 1.15;
    }

    .title {
      margin: 0 0 12px;
      font-size: 1.15em;
      font-weight: normal;
    }

    .details-title {
      margin: 0 0 12px;
      text-align: center;
      font-size: 1.15em;
    }

    .field {
      margin: 2px 0;
    }

    .separator {
      min-height: 8px;
      margin: 7px 0;
      border-bottom: 1px dashed #000;
    }

    .fare {
      margin: 0;
      text-align: right;
      font-weight: bold;
    }

    .printed-at {
      margin: 12px 0 0;
      text-align: center;
    }

    @media print {
      .ticket {
        padding: 0;
      }

      .logo {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <main class="ticket">
    <img class="logo" src="logoindex.jpeg" alt="Transporte Marítimo Caratasca">
    <h1 class="company">TRANSPORTE MARÍTIMO CARATASCA</h1>
    <p class="title">BOLETO</p>

    <p class="field">FECHA: <span id="fecha"></span></p>
    <p class="field">VIAJE: <span id="viaje"></span></p>

    <h2 class="details-title">DETALLES</h2>
    <p class="field">NOMBRE: <span id="nombre"></span></p>
    <p class="field">DNI: <span id="dni"></span></p>
    <p class="field">ORIGEN: <span id="origen"></span></p>
    <p class="field">TIPO DE PASAJE: <span id="tipo"></span></p>

    <div class="separator"></div>
    <p class="fare">PASAJE: <span id="pasaje"></span></p>
    <div class="separator"></div>

    <p class="field">EQUIPAJE: <span id="equipaje"></span></p>
    <p class="field">ENCARGADO: <span id="encargado"></span></p>
    <div class="separator"></div>
    <p class="field">NOTAS: <span id="notas"></span></p>
    <div class="separator"></div>

    <p class="printed-at" id="impreso"></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    function getParam(...names) {
      for (const name of names) {
        const value = params.get(name);
        if (value !== null) return value;
      }
      return "";
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    const fare = getParam("pasaje", "monto");
    setText("fecha", getParam("fecha", "date"));
    setText("viaje", getParam("viaje", "numviaje"));
    setText("nombre", getParam("nombre", "pasajero"));
    setText("dni", getParam("dni"));
    setText("origen", getParam("origen"));
    setText("tipo", getParam("tipo", "tipopasaje"));
    setText("pasaje", fare && !/^(L\.?\s*|HNL\s*)/i.test(fare) ? `L${fare}` : fare);
    setText("equipaje", getParam("equipaje"));
    setText("encargado", getParam("encargado"));
    setText("notas", getParam("notas"));

    const printedAt = getParam("impreso", "fechaimpresion", "fechaHora");
    document.getElementById("impreso").textContent = printedAt ||
      new Intl.DateTimeFormat("es-HN", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      }).format(new Date());

    window.onload = function () {
      window.print();
    };
  </script>
</body>
</html>
